<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<!-- The kit pictures are asked for by a path relative to the page, which is
     right for the game (its page is the deployment root) and wrong for this
     lab (its page is /tools/). This is dev-only, so a base is the whole fix. -->
<base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hitman: innings-end card review</title>
<style>
  html,body{height:100%;overflow:hidden;margin:0;background:#2f5a34}
  #lab{position:fixed;left:12px;top:12px;z-index:99;display:flex;gap:7px;flex-wrap:wrap;font:12px system-ui}
  #lab button{border:1px solid #ffffff4d;background:#00000059;color:#fff;border-radius:5px;padding:6px 11px;cursor:pointer}
  #lab button[aria-pressed=true]{background:#fff;color:#153}
  #stage{height:100%}
  /* On a phone the card is the whole screen, so the buttons cannot sit over it
     — which is exactly the width the card most needs reviewing at. They become
     one scrolling rail along the bottom, and the stage gives up its height
     rather than its middle. */
  @media (max-width:820px){
    #lab{
      left:0;right:0;top:auto;bottom:0;
      flex-wrap:nowrap;overflow-x:auto;gap:6px;
      padding:8px 10px calc(8px + env(safe-area-inset-bottom));
      background:#0b1f2ceb;backdrop-filter:blur(6px);
      border-top:1px solid #ffffff24;
      scrollbar-width:none
    }
    #lab::-webkit-scrollbar{display:none}
    #lab button{flex:0 0 auto;white-space:nowrap;padding:7px 12px}
    #stage{height:calc(100% - 52px)}
  }
  /* The lab stands in for the ground the overlay normally darkens. */
  #stage .stage{background:radial-gradient(circle at 50% 38%,#4d8347,#24462a 78%)}
</style></head>
<body>
<div id="lab">
  <button data-state="complete">Innings complete</button>
  <button data-state="record">Personal best</button>
  <button data-state="first">First innings</button>
  <button data-state="allout">All out</button>
  <button data-state="big">Big score</button>
  <button data-state="offer">On the board</button>
  <button data-state="offer-known">On the board, returning</button>
  <button data-state="offer-top">Top of the board</button>
  <button data-state="offer-blind">First on an empty board</button>
  <button data-state="missed">Missed the fiftieth</button>
  <button data-state="missed-duck">Out for a duck</button>
  <button data-state="missed-room">Duck, board still filling</button>
  <button data-state="offline">Board unreachable</button>
  <button data-state="standing">Beaten by your own top row</button>
  <button data-state="standing-mid">Beaten by your own 7th</button>
  <button data-state="private">Private window</button>
  <button data-state="form">Register form</button>
  <button data-state="form-update">Register form, updating</button>
  <button data-state="form-error">Name taken</button>
  <button data-state="sending">Sending</button>
  <button data-state="board">Full board, after</button>
</div>
<div id="stage"></div>
<script type="module" src="/tools/card-lab.ts"></script>
</body></html>
