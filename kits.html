<meta charset="utf-8">
<title>Super10 Team Kits</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* The six Super10 team kits on the game's own batter: drag to turn him round,
   pinch or scroll to come closer. A dev page, and the artifact
   scripts/kits-artifact.mjs builds from it. Single dark look, the brand's
   ink with lime for what is picked. */
@font-face{font-family:Saira;font-style:italic;font-weight:900;font-display:block;src:url(/src/assets/saira-latin-900-italic.woff2) format('woff2')}
:root{color-scheme:dark;--bg:#0d0a1f;--panel:#17122e;--line:#ffffff1c;--text:#f5f2ff;--text-2:#b4abd6;--accent:#b7ff3b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'Segoe UI',system-ui,sans-serif}
main{display:grid;gap:12px;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:980px;margin:0 auto}
h1{margin:0;font:italic 900 26px/1.1 Saira,'Arial Black',Impact,sans-serif;letter-spacing:.5px}
h1 b{color:var(--accent)}
.hint{margin:0;color:var(--text-2);font-size:13px}
#stage{width:100%;aspect-ratio:4/3;background:var(--panel);border-radius:14px;overflow:hidden;touch-action:none;position:relative}
@media (max-width:600px){#stage{aspect-ratio:3/4}}
#stage canvas{display:block;width:100%;height:100%}
#team{position:absolute;left:14px;top:12px;font:italic 900 20px/1.1 Saira,'Arial Black',Impact,sans-serif;pointer-events:none;text-shadow:0 2px 8px #000a}
#team small{display:block;font:600 11px/1.4 'Segoe UI',system-ui,sans-serif;letter-spacing:1px;color:var(--text-2);text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:8px}
.label{width:100%;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-2)}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:8px}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px #ffffff40}
</style>
<main>
  <h1>SUPER<b>10</b> team kits</h1>
  <p class="hint">Drag to turn him round. Pinch or scroll to come closer.</p>
  <div id="stage"><div id="team"></div></div>
  <div class="row" id="kits"><span class="label">Team</span></div>
  <div class="row"><span class="label">Look from</span>
    <button data-view="front" aria-pressed="true">Chest</button>
    <button data-view="side">Side on</button>
    <button data-view="back">Back</button>
    <button data-view="game">Game camera</button>
    <button id="spin" aria-pressed="false">Spin</button>
    <button id="night" aria-pressed="true">Floodlights</button>
  </div>
  <div class="row" id="numbers"><span class="label">Number on his back</span></div>
</main>
<script type="module" src="/src/kits-preview.ts"></script>
