<meta charset="utf-8">
<title>Super10 Kits</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* A dev page: the three Super10 kits on the game's own batter, from the
   front, the side, behind and from the game's camera, by day or under the
   floodlights. Single dark look. */
:root{color-scheme:dark;--bg:#0a0b0d;--panel:#12161b;--line:#ffffff17;--text:#f5efe6;--text-2:#a3b3bd;--accent:#b7ff3b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 'Segoe UI',system-ui,sans-serif}
main{display:grid;gap:12px;padding:16px;max-width:1100px;margin:0 auto}
h1{margin:0;font-size:22px}
#stage{width:100%;aspect-ratio:4/3;background:var(--panel);border-radius:12px;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
</style>
<main>
  <h1>Super10 kits</h1>
  <div class="row" id="kits"></div>
  <div class="row">
    <button data-view="front" aria-pressed="true">Chest</button>
    <button data-view="side">Side on</button>
    <button data-view="back">Back</button>
    <button data-view="game">Game camera</button>
    <button id="night" aria-pressed="true">Floodlights</button>
  </div>
  <div id="stage"></div>
</main>
<script type="module" src="/src/kits-preview.ts"></script>
